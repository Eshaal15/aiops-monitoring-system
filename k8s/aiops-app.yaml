apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-app
  template:
    metadata:
      labels:
        app: aiops-app
    spec:
      containers:
        - name: aiops-app
          image: host.docker.internal:5001/aiops-monitoring-system-aiops-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-app
spec:
  selector:
    app: aiops-app
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
